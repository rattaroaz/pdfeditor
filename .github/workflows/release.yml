name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.4.4)"
        required: true
        default: v1.4.4

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  RELEASE_NAME: PDF Editor ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  RELEASE_BODY: |
    Windows release for PDF Editor.

    - **latest.json** — used by the in-app updater (includes x64 and ARM64 entries)
    - **NSIS setup** (`.exe`) — first-time install or manual reinstall (x64 and ARM64)
    - **MSI** — managed / enterprise deployments (x64 only)

    Builds are published for **x64** and **ARM64** Windows. Installed copies update only when the user chooses Help → Check for updates.

jobs:
  release-windows-x64:
    runs-on: windows-latest
    outputs:
      releaseId: ${{ steps.tauri.outputs.releaseId }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install frontend dependencies
        run: npm run ci:install

      # WiX (MSI) requires VBScript on Windows Server runners.
      - name: Enable VBScript for MSI builds
        shell: pwsh
        run: |
          $cap = Get-WindowsCapability -Online | Where-Object { $_.Name -like 'VBSCRIPT*' }
          if (-not $cap) {
            throw 'VBSCRIPT Windows capability not found on this runner.'
          }
          if ($cap.State -ne 'Installed') {
            Add-WindowsCapability -Online -Name $cap.Name
          }

      - name: Verify updater signing secrets
        shell: pwsh
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) {
            throw @'
          TAURI_SIGNING_PRIVATE_KEY is not set.
          Add it under Settings → Secrets and variables → Actions:
            - TAURI_SIGNING_PRIVATE_KEY = contents of scripts/tauri-signing.key
            - TAURI_SIGNING_PRIVATE_KEY_PASSWORD = your signing key password
          Without these, tauri build fails after bundling and no latest.json is published.
          '@
          }
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD) {
            throw 'TAURI_SIGNING_PRIVATE_KEY_PASSWORD is not set (required for the password-protected signing key).'
          }
          Write-Host 'Updater signing secrets are present.'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - id: tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_COMMIT_SHA: ${{ github.sha }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: ${{ env.RELEASE_NAME }}
          releaseBody: ${{ env.RELEASE_BODY }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          retryAttempts: 3
          args: --target x86_64-pc-windows-msvc --bundles nsis,msi

      - name: Verify MSI was built and uploaded
        shell: pwsh
        run: |
          $msi = Get-ChildItem -Path src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi -Filter *.msi -Recurse -ErrorAction SilentlyContinue
          if (-not $msi) {
            $msi = Get-ChildItem -Path src-tauri/target/release/bundle/msi -Filter *.msi -Recurse -ErrorAction SilentlyContinue
          }
          if (-not $msi) {
            throw 'MSI bundle was not produced. Check the WiX/VBScript build step above.'
          }
          Write-Host "MSI ready: $($msi.FullName)"

  release-windows-arm64:
    needs: release-windows-x64
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc

      - name: Install frontend dependencies
        run: npm run ci:install

      - name: Verify updater signing secrets
        shell: pwsh
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) {
            throw 'TAURI_SIGNING_PRIVATE_KEY is not set.'
          }
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD) {
            throw 'TAURI_SIGNING_PRIVATE_KEY_PASSWORD is not set.'
          }
          Write-Host 'Updater signing secrets are present.'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - id: tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_COMMIT_SHA: ${{ github.sha }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.release-windows-x64.outputs.releaseId }}
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: ${{ env.RELEASE_NAME }}
          releaseBody: ${{ env.RELEASE_BODY }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          retryAttempts: 3
          args: --target aarch64-pc-windows-msvc --bundles nsis

      - name: Verify NSIS was built and uploaded
        shell: pwsh
        run: |
          $nsis = Get-ChildItem -Path src-tauri/target/aarch64-pc-windows-msvc/release/bundle/nsis -Filter *.exe -Recurse -ErrorAction SilentlyContinue
          if (-not $nsis) {
            $nsis = Get-ChildItem -Path src-tauri/target/release/bundle/nsis -Filter *.exe -Recurse -ErrorAction SilentlyContinue
          }
          if (-not $nsis) {
            throw 'NSIS bundle was not produced for ARM64.'
          }
          Write-Host "NSIS ready: $($nsis.FullName)"

  verify-updater-manifest:
    needs: release-windows-arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify merged latest.json includes x64 and ARM64
        env:
          MANIFEST_URL: https://github.com/rattaroaz/pdfeditor/releases/download/${{ env.RELEASE_TAG }}/latest.json
        run: node scripts/verify-latest-json.mjs "$MANIFEST_URL"
