name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.1.6)"
        required: true
        default: v1.1.6

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      # WiX (MSI) requires VBScript on Windows Server runners.
      - name: Enable VBScript for MSI builds
        shell: pwsh
        run: |
          $cap = Get-WindowsCapability -Online | Where-Object { $_.Name -like 'VBSCRIPT*' }
          if (-not $cap) {
            throw 'VBSCRIPT Windows capability not found on this runner.'
          }
          if ($cap.State -ne 'Installed') {
            Add-WindowsCapability -Online -Name $cap.Name
          }

      - name: Verify updater signing secrets
        shell: pwsh
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) {
            throw @'
          TAURI_SIGNING_PRIVATE_KEY is not set.
          Add it under Settings → Secrets and variables → Actions:
            - TAURI_SIGNING_PRIVATE_KEY = contents of scripts/tauri-signing.key
            - TAURI_SIGNING_PRIVATE_KEY_PASSWORD = your signing key password
          Without these, tauri build fails after bundling and no latest.json is published.
          '@
          }
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD) {
            throw 'TAURI_SIGNING_PRIVATE_KEY_PASSWORD is not set (required for the password-protected signing key).'
          }
          Write-Host 'Updater signing secrets are present.'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_COMMIT_SHA: ${{ github.sha }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          releaseName: PDF Editor ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          releaseBody: |
            Windows release for PDF Editor.

            - **latest.json** — used by the in-app updater (background download + restart)
            - **NSIS setup** (`.exe`) — first-time install or manual reinstall
            - **MSI** — managed / enterprise installs

            Installed copies check `latest.json` on startup and apply signed updates automatically.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          args: --bundles nsis,msi

      - name: Verify MSI was built and uploaded
        shell: pwsh
        run: |
          $msi = Get-ChildItem -Path src-tauri/target/release/bundle/msi -Filter *.msi -Recurse -ErrorAction SilentlyContinue
          if (-not $msi) {
            throw 'MSI bundle was not produced. Check the WiX/VBScript build step above.'
          }
          Write-Host "MSI ready: $($msi.FullName)"
